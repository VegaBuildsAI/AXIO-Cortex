services:
  searxng:
    image: searxng/searxng:latest
    container_name: axio-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is generated by scripts/start_searxng.ps1}
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
