# models.yaml — AxioModel Improvement v2.1
#
# HYBRID SCHEME: gemma4:12b is the local base; the agentic tier boosts to the
# Claude API. Switch the Claude model + effort in-app (model opus | model sonnet
# | model opus max | effort xhigh). Under LOCAL_ONLY=1 everything runs on gemma4.
#
# The embedding model (nomic-embed-text, 768-dim) is a separate background
# tokenizer and is intentionally NOT listed as a routable generation model.

local_models:
  gemma4_12b:
    provider: ollama
    name: gemma4:12b
    role: local_base
    temperature: 0.3
    top_p: 0.9
    capabilities:
      - tools
      - thinking
      - vision
      - audio
    recommended_for:
      - fast chat
      - summaries / drafting
      - session summarization (Tier-2 memory)
      - vision / image understanding
      - local fallback for the agentic tier

external_models:
  claude_opus:
    provider: anthropic
    name: claude-opus-4-8
    alias: opus
    role: frontier_agentic
    effort: max            # low | medium | high | xhigh | max
    recommended_for:
      - autonomous coding (Code mode)
      - repo analysis / refactoring
      - ASC 606 revenue analysis (RevRec)
      - complex production / legal / audit deliverables

  claude_sonnet:
    provider: anthropic
    name: claude-sonnet-4-6
    alias: sonnet
    role: lighter_claude
    effort: high           # xhigh is Opus-only
    recommended_for:
      - cheaper / faster Claude work
      - high-volume agentic tasks
