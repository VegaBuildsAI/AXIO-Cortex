# routing.yaml — AxioModel Improvement v2.1
#
# HYBRID ROUTING (local base + Claude boost):
#   gemma4:12b       local base — chat, quick drafts, summaries, vision
#   claude-opus-4-8  frontier agentic tier — code / reasoning / revenue / premium
#   claude-sonnet-4-6 lighter Claude alternative (switch in-app: model sonnet)
#   Under LOCAL_ONLY=1 the agentic routes fall back to gemma4:12b.

model_router:
  default_model: "gemma4:12b"
  routes:
    quick_chat:
      model: "gemma4:12b"
      temperature: 0.3
      max_context: 4096

    revenue_analysis:
      model: "claude-opus-4-8"      # boosts to Claude; local fallback gemma4:12b
      effort: "max"

    coding_agent:
      model: "claude-opus-4-8"      # Code mode; local fallback gemma4:12b
      effort: "max"

    exact_math:
      tool: "python"
      model: null

    premium_reasoning:
      provider: "anthropic"
      model: "claude-opus-4-8"
      effort: "max"
      local_fallback: "gemma4:12b"  # used when LOCAL_ONLY=1 or no API key
      trigger:
        - "large codebase"
        - "complex architecture"
        - "production bug"
        - "high-value deliverable"
        - "ASC606 policy memo"
        - "audit memo"
